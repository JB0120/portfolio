<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>불상</title>
<script src="https://kit.fontawesome.com/632d3e2496.js" crossorigin="anonymous"></script>
<style>
  .flip-card{
    width: 96px;
    height: 200px;
    background: transparent;
    perspective: 1000px;
  }

  .flip-card-inner{
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .flip-card-front, 
  .flip-card-back{
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }
  .flip-card-front{
    background-color: transparent;
  }
  .flip-card-back{
    background-color: transparent;
    transform: rotateY(180deg);
  }
  .flip-card:hover>.flip-card-inner{
    transform: rotateY(180deg);
  }
</style>
</head>

<body>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="img/bull_front.png" alt="">
      </div>
      <div class="flip-card-back">
        <img src="img/bull_back.png" alt="">
      </div>
    </div>
  </div>
</body>
</html>
